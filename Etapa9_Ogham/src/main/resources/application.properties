spring.application.name=ogham-web
server.port=8080
spring.datasource.url=${OGHAM_DB_URL:jdbc:mysql://localhost:3306/oghamdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${OGHAM_DB_USER:root}
spring.datasource.password=${OGHAM_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.sql.init.mode=never
ogham.storage.dir=${OGHAM_STORAGE_DIR:./data/docs}
ogham.session.timeout-minutes=60
